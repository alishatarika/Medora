<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor AI Chatbot</title>
  <style>
    /* ===== GENERAL PAGE STYLING ===== */
    body {
      background: radial-gradient(circle at top, #1b1b1b, #0d0d0d);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* ===== CHAT CONTAINER ===== */
    .chat-container {
      background: rgba(30, 30, 30, 0.9);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 255, 200, 0.2);
      padding: 40px;
      width: 400px;
      max-width: 90%;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(20, 184, 166, 0.5);
    }

    /* ===== HEADER ===== */
    .chat-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .chat-header h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #14b8a6;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .chat-header p {
      font-size: 0.95rem;
      color: #9be3d6;
      margin: 0;
    }

    /* ===== INPUT FIELD ===== */
    form input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #14b8a6;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }

    form input[type="text"]:focus {
      border-color: #18d6c1;
      background-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 10px rgba(20, 184, 166, 0.3);
    }

    /* ===== BUTTON ===== */
    .btn {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: #14b8a6;
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #0d9488;
      box-shadow: 0 0 15px rgba(20, 184, 166, 0.5);
    }

    /* ===== RESPONSE BOX ===== */
    .response-box {
      margin-top: 20px;
      background: rgba(20, 184, 166, 0.1);
      border-left: 4px solid #14b8a6;
      padding: 15px;
      border-radius: 10px;
      color: #b9fff4;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    strong {
      color: #14b8a6;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h2>Doctor AI Chatbot</h2>
      <p>Your friendly health assistant 🤖</p>
    </div>

    <form method="POST">
      <input type="text" name="query" placeholder="Ask your medical question..." value="{{user_input}}" required>
      <button type="submit" class="btn">Ask Doctor</button>
    </form>

    {% if response %}
    <div class="response-box">
      <strong>Doctor AI:</strong> {{response}}
    </div>
    {% endif %}
  </div>
</body>
</html>
