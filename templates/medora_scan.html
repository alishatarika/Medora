<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner - Medora</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        #scanner-container {
            width: 90%;
            max-width: 600px;
            border: 2px solid #00bcd4;
            padding: 20px;
            border-radius: 10px;
            background: #222;
            text-align: center;
        }
        #qr-reader {
            width: 100%;
            height: 400px;
            border: 2px solid #00bcd4;
            margin-top: 10px;
            border-radius: 10px;
        }
        button {
            padding: 12px;
            background: #00bcd4;
            border: none;
            border-radius: 8px;
            color: black;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            width: 90%;
        }
        button:hover { background: #0098a6; }
        input[type="file"] { display: none; }
    </style>

    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<div id="scanner-container">
    <h1>🔍 Medora QR Scanner</h1>
    <p>Scan using camera or upload an image</p>

    <div id="qr-reader"></div>

    <button id="toggleCam">Start Scanner</button>

    <button id="uploadBtn">📁 Upload QR Image</button>
    <input type="file" id="qrUpload" accept="image/*">
</div>

<script>
    let qrScanner = null;
    let scannerRunning = false;

    async function startScanner() {
        try {
            qrScanner = new Html5Qrcode("qr-reader");

            await navigator.mediaDevices.getUserMedia({ video: true });

            qrScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 300 },
                (decodedText) => {
                    console.log("Scanned:", decodedText);
                    alert("QR Found: " + decodedText);
                    window.location.href = decodedText;
                }
            );
            scannerRunning = true;
            document.getElementById("toggleCam").innerText = "Stop Scanner";
        } catch (err) {
            alert("Camera access blocked! Please allow permissions in Brave.");
        }
    }

    async function stopScanner() {
        if (qrScanner) {
            await qrScanner.stop();
            scannerRunning = false;
            document.getElementById("toggleCam").innerText = "Start Scanner";
        }
    }

    document.getElementById("toggleCam").addEventListener("click", () => {
        if (!scannerRunning) startScanner();
        else stopScanner();
    });

    // Image Upload Scanner
    document.getElementById("uploadBtn").onclick = () => {
        document.getElementById("qrUpload").click();
    };

    document.getElementById("qrUpload").addEventListener("change", async (e) => {
        if (!qrScanner) qrScanner = new Html5Qrcode("qr-reader");

        const file = e.target.files[0];
        const result = await qrScanner.scanFile(file, true);

        alert("QR Detected: " + result);
        window.location.href = result;
    });
</script>

</body>
</html>
